name: build

# Tests, then the .deb, .rpm and AppImage for x64 and arm64, and the Flatpak, kept as the
# run's artifacts. Nothing is published: a release is made by hand.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --linux deb rpm --x64 --arm64 --publish never
      - run: npx electron-builder --linux AppImage --x64 --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: lydia-linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
      - run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08
      - run: npm ci
      - run: npx electron-builder --linux flatpak --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: lydia-flatpak
          path: dist/*.flatpak
          if-no-files-found: error

  # Each package installed on a clean system, then Lydia started on a virtual screen:
  # the dependencies resolve and she gets as far as picking a desktop backend.
  install-test:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'ubuntu:22.04', kind: deb }
          - { image: 'ubuntu:24.04', kind: deb }
          - { image: 'debian:12', kind: deb }
          - { image: 'fedora:42', kind: rpm }
          - { image: 'archlinux:latest', kind: appimage }
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lydia-linux
      - name: install
        run: |
          case "${{ matrix.kind }}" in
            deb)
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y ./lydia_*_amd64.deb xvfb xauth dbus-x11
              echo "LYDIA=/opt/Lydia/lydia" >> "$GITHUB_ENV" ;;
            rpm)
              dnf install -y ./lydia-*.x86_64.rpm xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon which
              echo "LYDIA=/opt/Lydia/lydia" >> "$GITHUB_ENV" ;;
            appimage)
              pacman -Syu --noconfirm xorg-server-xvfb xorg-xauth dbus nss gtk3 alsa-lib libxss python python-gobject
              APP=$(ls $PWD/Lydia-*.AppImage | grep -v arm64)
              chmod +x "$APP"
              echo "LYDIA=$APP" >> "$GITHUB_ENV"
              echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV" ;;
          esac
      - name: start
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" timeout 40 "$LYDIA" --no-sandbox > lydia.log 2>&1 || true
          cat lydia.log | grep -v "dbus\|atom_cache" | tail -20
          grep -q "\[lydia\] desktop:" lydia.log
