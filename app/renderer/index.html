<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>Lydia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="island">
    <!-- Collapsed: a small pill with Lydia and one number. -->
    <div class="pill-view">
      <span class="pill-clock" id="pill-clock"></span>
      <span class="pill-metric" id="pill-metric"><span id="pill-label">RAM</span> <b id="pill-value">--%</b></span>
      <span class="badge" id="badge"></span>
    </div>

    <!-- Something playing, the desktop below: a small player (like a phone's lock screen). -->
    <div class="music-view" id="music">
      <div class="music-bg" id="music-bg"></div>
      <div class="music-top">
        <div class="music-cover" id="music-cover" data-i18n-title="music.open"></div>
        <div class="music-meta" id="music-meta" data-i18n-title="music.open"><b id="music-title"></b><span id="music-artist"></span></div>
        <button class="music-play" id="music-play"></button>
      </div>
      <div class="music-bottom">
        <button class="music-btn" data-act="previous"><svg viewBox="0 0 24 24"><path d="M7 5.5h2v13H7zM19 5.5v13L10 12z"/></svg></button>
        <div class="scrub" id="music-scrub">
          <svg class="squiggle" id="music-squiggle" preserveAspectRatio="none"><path id="music-wave"/></svg>
          <i class="rest" id="music-rest"></i>
          <input type="range" id="music-pos" min="0" max="1000" value="0" step="1">
        </div>
        <button class="music-btn" data-act="next"><svg viewBox="0 0 24 24"><path d="M15 5.5h2v13h-2zM5 5.5v13l9-6.5z"/></svg></button>
        <span class="music-vol" data-i18n-title="music.volume">
          <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="stroke" d="M15.5 9a4 4 0 0 1 0 6"/></svg>
          <input type="range" id="music-volume" min="0" max="100" value="50">
        </span>
      </div>
    </div>

    <!-- Expanded: tabs, then one of the views. -->
    <div class="panel-view">
      <div class="topbar">
        <div class="tabs">
          <button class="tab" data-view="controls" data-i18n-title="tab.controls"><svg viewBox="0 0 24 24"><path class="stroke" d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle class="stroke" cx="16" cy="7" r="2"/><circle class="stroke" cx="10" cy="17" r="2"/></svg></button>
          <button class="tab" data-view="today" data-i18n-title="tab.today"><svg viewBox="0 0 24 24"><rect class="stroke" x="4" y="5.5" width="16" height="14" rx="2.5"/><path class="stroke" d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg></button>
          <button class="tab" data-view="tasks" data-i18n-title="tab.stats"><svg viewBox="0 0 24 24"><path class="stroke" d="M5 19V11M10 19V6M15 19v-5M20 19V9"/></svg></button>
          <button class="tab" data-view="clip" data-i18n-title="tab.clip"><svg viewBox="0 0 24 24"><rect class="stroke" x="5.5" y="5" width="13" height="15" rx="2"/><path class="stroke" d="M9 5V3.8h6V5M9 10h6M9 14h4"/></svg></button>
          <button class="tab" data-view="apps" data-i18n-title="tab.apps"><svg viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="6" height="6" rx="1.6"/><rect x="13.5" y="4.5" width="6" height="6" rx="1.6"/><rect x="4.5" y="13.5" width="6" height="6" rx="1.6"/><rect x="13.5" y="13.5" width="6" height="6" rx="1.6"/></svg></button>
          <button class="tab" data-view="wall" data-i18n-title="tab.wall"><svg viewBox="0 0 24 24"><rect class="stroke" x="3.5" y="5" width="17" height="14" rx="2.5"/><path class="stroke" d="M6 17l4.5-5 3 3 2-2L19 17"/><circle cx="15.5" cy="9" r="1.5"/></svg></button>
          <button class="tab" data-view="power" data-i18n-title="tab.power"><svg viewBox="0 0 24 24"><path class="stroke" d="M12 4v7M7.5 7a7 7 0 1 0 9 0"/></svg></button>
          <button class="tab" data-view="chat" data-i18n-title="tab.chat"><svg viewBox="0 0 24 24"><path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-7l-4 3.5V16H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg></button>
          <button class="tab" data-view="look" data-i18n-title="tab.look"><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 0 16c1.1 0 1.6-.8 1.6-1.6 0-.5-.2-.8-.4-1.1-.3-.3-.4-.6-.4-1.1 0-.9.7-1.6 1.6-1.6H16a4 4 0 0 0 4-4C20 7 16.4 4 12 4zm-4.5 8a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6zm2.5-3.4a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6zm4 0a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6zm2.5 3.4a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6z"/></svg></button>
        </div>
        <div class="tools left">
          <button id="btn-mic" class="tool" data-i18n-title="voice.mic_tip">
            <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path class="stroke" d="M6.5 11.5a5.5 5.5 0 0 0 11 0M12 17v3.5"/></svg>
          </button>
          <button id="btn-menu" class="tool" data-i18n-title="tool.menu">
            <svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18" cy="12" r="1.8"/></svg>
          </button>
        </div>
        <div class="tools">
          <button id="btn-notif" class="tool" data-view="notif" data-i18n-title="tool.notif">
            <svg viewBox="0 0 24 24"><path d="M12 4a5 5 0 0 1 5 5v3.5l1.6 2.9a.7.7 0 0 1-.6 1.1H6a.7.7 0 0 1-.6-1.1L7 12.5V9a5 5 0 0 1 5-5zM10 18.5a2 2 0 0 0 4 0"/></svg>
            <i class="count" id="notif-count"></i>
          </button>
          <button id="btn-overview" class="tool" data-i18n-title="tool.overview">
            <svg viewBox="0 0 24 24"><rect class="stroke" x="3.5" y="5.5" width="7" height="6" rx="1.5"/><rect class="stroke" x="13.5" y="5.5" width="7" height="6" rx="1.5"/><rect class="stroke" x="3.5" y="14.5" width="7" height="4.5" rx="1.5"/><rect class="stroke" x="13.5" y="14.5" width="7" height="4.5" rx="1.5"/></svg>
          </button>
          <button id="btn-settings" class="tool" data-i18n-title="tool.settings">
            <svg viewBox="0 0 24 24"><circle class="stroke" cx="12" cy="12" r="3"/><path class="stroke" d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4 18 18M6 18l1.6-1.6M16.4 7.6 18 6"/></svg>
          </button>
        </div>
      </div>

      <div class="cards view-cards">
        <div class="card main">
          <!-- home view -->
          <div class="feed view-home">
            <div class="line dim" id="feed-1"></div>
            <div class="line now" id="feed-2"></div>
            <div class="line dim wrap" id="feed-3"></div>
            <div class="actions" id="actions"></div>
          </div>
          <!-- appearance view -->
          <div class="appearance view-look">
            <div class="appearance-row">
              <span data-i18n="look.accent"></span>
              <div class="swatches" id="sw-accent"></div>
            </div>
            <div class="appearance-row">
              <span data-i18n="look.bar"></span>
              <div class="seg" id="bar-content">
                <button data-v="info" data-i18n="bar.info"></button><button data-v="clock" data-i18n="bar.clock"></button><button data-v="both" data-i18n="bar.both"></button>
              </div>
            </div>
            <div class="appearance-row">
              <span data-i18n="look.language"></span>
              <select class="pick" id="language"></select>
            </div>
            <button class="link" id="look-reset" data-i18n="look.reset"></button>
          </div>
        </div>
        <div class="card side">
          <div class="view-look">
            <div class="pref-row">
              <span data-i18n="pref.chat_default"></span>
              <div class="seg" id="default-provider">
                <button data-p="claude">Claude</button><button data-p="gemini">Gemini</button><button data-p="ollama" data-i18n="provider.local"></button>
              </div>
            </div>
            <button class="switch" data-pref="music_card" role="switch" aria-checked="false">
              <i></i><span data-i18n="pref.music_card"></span>
            </button>
            <button class="switch" data-pref="hide_in_games" role="switch" aria-checked="false" data-i18n-title="pref.games_tip">
              <i></i><span data-i18n="pref.games"></span>
            </button>
            <button class="switch" data-pref="hide_in_fullscreen" role="switch" aria-checked="false" data-i18n-title="pref.fullscreen_tip">
              <i></i><span data-i18n="pref.fullscreen"></span>
            </button>
            <button class="switch" data-pref="voice_followup" role="switch" aria-checked="false" data-i18n-title="pref.followup_tip">
              <i></i><span data-i18n="pref.followup"></span>
            </button>
            <button class="switch" data-pref="voice_cloud" role="switch" aria-checked="false" data-i18n-title="pref.voice_cloud_tip">
              <i></i><span data-i18n="pref.voice_cloud"></span>
            </button>
            <button class="switch" data-pref="hide_gnome_panel" role="switch" aria-checked="false" data-i18n-title="pref.hide_panel_tip" hidden>
              <i></i><span data-i18n="pref.hide_panel"></span>
            </button>
            <button class="switch" data-pref="super_opens" role="switch" aria-checked="false" data-i18n-title="pref.super_tip" hidden>
              <i></i><span data-i18n="pref.super"></span>
            </button>
            <div class="pref-row" id="super-tab-row" hidden>
              <span data-i18n="pref.super_tab"></span>
              <select class="pick" id="super-tab"></select>
            </div>
          </div>
        </div>
      </div>
      <!-- the workstation views: full width, sized per view (VIEW_W / VIEW_H) -->
      <div class="wide view-tasks">
        <div class="stats-left">
          <div class="gauges">
            <div class="card gauge" id="g-cpu"><i class="ring big"></i><b></b><span>CPU</span><small></small></div>
            <div class="card gauge" id="g-ram"><i class="ring big"></i><b></b><span>RAM</span><small></small></div>
            <div class="card gauge" id="g-disk"><i class="ring big"></i><b></b><span data-i18n="metric.disk"></span><small></small></div>
          </div>
          <div class="stat-row">
            <div class="card stat"><span class="label" data-i18n="sys.up_label"></span><b id="sys-up"></b></div>
            <div class="card stat"><span class="label" data-i18n="sys.net_label"></span><b id="sys-net">—</b><button class="s-btn" id="sys-speed" data-i18n="sys.speed"></button></div>
          </div>
        </div>
        <div class="card content">
          <div class="content-head">
            <span class="label" data-i18n="sys.top"></span>
            <div class="seg" id="tasks-sort">
              <button data-by="cpu" class="on">CPU</button><button data-by="ram" data-i18n="tasks.memory"></button>
            </div>
          </div>
          <div class="task-list" id="task-list"></div>
        </div>
      </div>

      <div class="wide view-notif">
        <div class="card content">
          <div class="content-head">
            <span class="label" data-i18n="notif.title"></span>
            <button class="link small" id="notif-dnd"></button>
            <button class="link small" id="notif-clear" data-i18n="notif.clear"></button>
          </div>
          <div class="notif-list" id="notif-list"></div>
        </div>
      </div>

      <div class="wide view-controls">
        <div class="card content">
          <div class="ctl-grid" id="ctl-grid"></div>
          <div class="ctl-sliders" id="ctl-sliders"></div>
        </div>
        <div class="card player" id="player"></div>
      </div>

      <div class="wide view-today">
        <div class="card clock-card">
          <b id="clock-time"></b>
          <span id="clock-day"></span>
          <small id="clock-date"></small>
        </div>
        <div class="card content">
          <span class="label" data-i18n="today.week"></span>
          <div class="week" id="week"></div>
          <div class="timers" id="timers"></div>
        </div>
        <div class="card content">
          <span class="label" data-i18n="today.title"></span>
          <div class="todo" id="todo"></div>
          <form class="task-form" id="task-form">
            <input id="task-text" autocomplete="off" data-i18n-ph="today.add_ph">
            <input id="task-time" type="time" data-i18n-title="today.time_tip">
            <button type="submit" class="add" data-i18n-title="today.add">+</button>
          </form>
        </div>
      </div>

      <div class="wide view-clip">
        <div class="card content">
          <div class="content-head">
            <input class="search" id="clip-search" autocomplete="off" data-i18n-ph="clip.search">
            <button class="link small" id="clip-pause"></button>
            <button class="link small" id="clip-clear" data-i18n="clip.clear"></button>
          </div>
          <div class="clip-list" id="clip-list"></div>
        </div>
      </div>

      <div class="wide view-apps">
        <div class="card content">
          <div class="content-head"><input class="search" id="app-search" autocomplete="off" data-i18n-ph="apps.search"></div>
          <div class="app-grid" id="app-grid"></div>
        </div>
      </div>

      <div class="wide view-wall">
        <div class="card content">
          <div class="content-head"><span class="pill-tag" id="wall-dir"></span><span class="muted" id="wall-count"></span><button class="tool" id="wall-pick" data-i18n-title="wall.pick"><svg viewBox="0 0 24 24"><path class="stroke" d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg></button></div>
          <div class="wall-strip" id="wall-strip"></div>
        </div>
      </div>

      <div class="wide view-power">
        <div class="card content">
          <div class="power-grid" id="power-grid">
            <button data-p="lock"><svg viewBox="0 0 24 24"><rect class="stroke" x="5.5" y="10.5" width="13" height="9" rx="2"/><path class="stroke" d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg><span data-i18n="power.lock"></span></button>
            <button data-p="suspend"><svg viewBox="0 0 24 24"><path class="stroke" d="M18 14.5A7 7 0 1 1 9.5 6a5.5 5.5 0 0 0 8.5 8.5z"/></svg><span data-i18n="power.suspend"></span></button>
            <button data-p="logout"><svg viewBox="0 0 24 24"><path class="stroke" d="M14 5h4.5v14H14M10 8l-4 4 4 4M6 12h9"/></svg><span data-i18n="power.logout"></span></button>
            <button data-p="restart"><svg viewBox="0 0 24 24"><path class="stroke" d="M19 12a7 7 0 1 1-2.1-5M19 4.5V8h-3.5"/></svg><span data-i18n="power.restart"></span></button>
            <button data-p="shutdown"><svg viewBox="0 0 24 24"><path class="stroke" d="M12 4v7M7.5 7a7 7 0 1 0 9 0"/></svg><span data-i18n="power.shutdown"></span></button>
          </div>
          <div class="power-confirm" id="power-confirm" hidden></div>
        </div>
      </div>

      <div class="wide view-chat">
        <!-- Lydia herself: only here, where you talk to her. No mouth: it's all in the eyes. -->
        <div class="card lydia-card">
          <div id="lydia">
            <div class="breath">
              <svg viewBox="0 0 100 100" aria-hidden="true">
                <defs>
                  <radialGradient id="g-orb" cx="34%" cy="28%" r="82%">
                    <stop offset="0" class="b0"/>
                    <stop offset=".34" class="b1"/>
                    <stop offset=".74" class="b2"/>
                    <stop offset="1" class="b3"/>
                  </radialGradient>
                </defs>
                <circle cx="50" cy="50" r="44" fill="url(#g-orb)"/>
                <g class="face">
                  <g transform="translate(35 50)"><g class="eye left">
                    <rect class="eye-dot" x="-7" y="-8.5" width="14" height="17" rx="7"/>
                    <path class="eye-happy" d="M-8 3 Q0 -8 8 3"/>
                  </g></g>
                  <g transform="translate(65 50)"><g class="eye right">
                    <rect class="eye-dot" x="-7" y="-8.5" width="14" height="17" rx="7"/>
                    <path class="eye-happy" d="M-8 3 Q0 -8 8 3"/>
                  </g></g>
                </g>
              </svg>
            </div>
            <span class="bubble think"><i></i><i></i><i></i></span>
            <span class="bubble talk"><i></i><i></i><i></i><i></i></span>
          </div>
        </div>
        <div class="card content chat">
          <div class="content-head">
            <span class="ghost-tag" data-i18n-title="chat.temp_tip">
              <svg viewBox="0 0 24 24"><path d="M12 3a7 7 0 0 0-7 7v10l2.3-1.8L9.6 20l2.4-1.8 2.4 1.8 2.3-1.8L19 20V10a7 7 0 0 0-7-7zm-2.5 8.2a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6zm5 0a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6z"/></svg>
              <span data-i18n="chat.temp"></span>
            </span>
            <div class="seg" id="chat-provider" data-i18n-title="chat.provider_tip">
              <button data-p="claude">Claude</button><button data-p="gemini">Gemini</button><button data-p="ollama" data-i18n="provider.local"></button>
            </div>
            <select class="pick" id="chat-model" data-i18n-title="chat.model_tip"></select>
            <button class="link small" id="chat-new" data-i18n="chat.new"></button>
          </div>
          <form class="keybox" id="keybox" hidden>
            <span data-i18n="key.prompt"></span>
            <div class="keyrow">
              <input type="password" id="gemini-key" data-i18n-ph="key.placeholder" autocomplete="off" spellcheck="false">
              <button type="button" class="paste" id="paste-key" data-i18n-title="key.paste_tip" data-i18n="key.paste"></button>
              <button type="submit" data-i18n="key.save"></button>
              <button type="button" class="link small" id="get-key" data-i18n="key.get"></button>
            </div>
            <em id="key-error"></em>
          </form>
          <div class="messages" id="messages"></div>
          <form class="composer" id="composer">
            <textarea id="chat-input" rows="1" data-i18n-ph="chat.placeholder"></textarea>
            <button type="submit" id="chat-send" data-i18n-title="chat.send">
              <svg viewBox="0 0 24 24"><path d="M4 12 20 4l-6 16-2.5-6.5z"/></svg>
            </button>
          </form>
        </div>
      </div>

      <div class="wide view-setup">
        <div class="card content setup">
          <div class="setup-head">
            <div class="dots" id="setup-dots"></div>
            <button class="link small" id="setup-skip" data-i18n="setup.skip"></button>
          </div>
          <div class="setup-body" id="setup-body"></div>
          <div class="setup-foot">
            <button class="link small" id="setup-back" data-i18n="setup.back"></button>
            <button class="go" id="setup-next"></button>
          </div>
        </div>
      </div>
    </div>

  </div>
  <script src="../i18n.js"></script>
  <script src="island.js"></script>
  <script src="workstation.js"></script>
</body>
</html>
